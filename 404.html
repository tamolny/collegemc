<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found - CollegeMC</title>
  <link rel="icon" type="image/png" href="images/logo_cmc.png">
  <link rel="apple-touch-icon" href="images/logo_cmc.png">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { padding-bottom: 0; }
    .error-wrap {
      min-height: 100svh;
      display: grid;
      place-content: center;
      justify-items: start;
      gap: var(--space-lg);
      max-width: 760px;
      margin-inline: auto;
      padding: var(--space-2xl) var(--gutter);
    }
    .error-wrap img { width: 168px; height: auto; }
    .error-code { font-size: clamp(4rem, 12vw, 7rem); line-height: 0.9; font-weight: 700; color: var(--color-focus); }
    .error-wrap h1 { font-size: clamp(2rem, 5vw, 3rem); }
  </style>
</head>
<body>
  <main class="error-wrap">
    <img src="images/logo_cmc.png" alt="CollegeMC" width="1920" height="1252">
    <p class="error-code">404</p>
    <h1>Page not found</h1>
    <p class="lead">This page doesn’t exist or was moved. Head back home and try again!</p>
    <a href="index.html" class="btn">Back home</a>
  </main>
</body>
</html>
